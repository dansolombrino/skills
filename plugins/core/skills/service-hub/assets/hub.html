<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__HUB_TITLE__</title>
<link id="favicon" rel="icon" href="__HUB_ICON__">
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8; --card: #ffffff; --line: #e4e6ea; --line-strong: #d3d6dc;
    --text: #14161a; --muted: #687080; --faint: #9aa1ad;
    --accent: #2563eb; --accent-soft: #e8efff;
    --up: #16a34a; --up-soft: #e7f6ec; --down: #dc2626; --down-soft: #fdecec; --unk: #9aa1ad; --unk-soft: #eef0f3;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 18px rgba(16,24,40,.06);
    --shadow-hover: 0 2px 4px rgba(16,24,40,.06), 0 14px 32px rgba(16,24,40,.12);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e1014; --card: #161920; --line: #262a33; --line-strong: #333845;
      --text: #e7e9ed; --muted: #9aa1ad; --faint: #6b7280;
      --accent: #6b9bff; --accent-soft: #1b2540;
      --up: #34d399; --up-soft: #12261d; --down: #f87171; --down-soft: #2a1515; --unk: #6b7280; --unk-soft: #1d2027;
      --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-hover: 0 10px 30px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1014; --card: #161920; --line: #262a33; --line-strong: #333845;
    --text: #e7e9ed; --muted: #9aa1ad; --faint: #6b7280;
    --accent: #6b9bff; --accent-soft: #1b2540;
    --up: #34d399; --up-soft: #12261d; --down: #f87171; --down-soft: #2a1515; --unk: #6b7280; --unk-soft: #1d2027;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-hover: 0 10px 30px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--sans); min-height: 100vh; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 48px; }

  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
  .mark { width: 40px; height: 40px; border-radius: 11px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; }
  .mark.img { background: none; border-radius: 0; }
  .mark img { width: 100%; height: 100%; object-fit: contain; }
  .head { flex: 1 1 220px; min-width: 0; }
  h1 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .sum { display: inline-flex; align-items: center; gap: 6px; }
  .tools { display: flex; gap: 8px; align-items: center; flex: 1 1 260px; justify-content: flex-end; }
  .search { position: relative; flex: 1 1 200px; max-width: 280px; }
  .search input { width: 100%; padding: 8px 10px 8px 32px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--card); color: inherit; font: inherit; font-size: 14px; }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .kbd { font: 11px var(--mono); color: var(--faint); border: 1px solid var(--line-strong); border-radius: 5px; padding: 0 5px; }
  .search .kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }
  button.icon { border: 1px solid var(--line-strong); background: var(--card); color: var(--muted); border-radius: 9px; width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; flex: none; }
  button.icon:hover { color: var(--text); }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
  a.card { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: inherit; text-decoration: none; box-shadow: var(--shadow); transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease; min-height: 150px; }
  a.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: var(--line-strong); }
  a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a.card.down { opacity: .82; }
  .top { display: flex; align-items: center; gap: 12px; }
  .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none; font-weight: 700; }
  .name { font-weight: 650; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
  .route { font: 12px var(--mono); color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  .desc { color: var(--muted); font-size: 13.5px; flex: 1; }
  .foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-weight: 600; font-size: 12px; }
  .pill.up { background: var(--up-soft); color: var(--up); }
  .pill.down { background: var(--down-soft); color: var(--down); }
  .pill.unknown { background: var(--unk-soft); color: var(--unk); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.up .dot { box-shadow: 0 0 0 0 currentColor; animation: pulse 2.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 45%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  @media (prefers-reduced-motion: reduce) { .pill.up .dot { animation: none; } a.card { transition: none; } }
  .foot .kbd { margin-left: auto; }
  .ext { color: var(--faint); }
  .detail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  .empty, .err { border: 1px dashed var(--line-strong); border-radius: 14px; padding: 28px; text-align: center; color: var(--muted); }
  .err { border-style: solid; border-color: var(--down); color: var(--down); background: var(--down-soft); margin-bottom: 14px; display: none; }
  code { font: 12.5px var(--mono); background: var(--unk-soft); padding: 1px 5px; border-radius: 5px; }
  footer { margin-top: 28px; color: var(--faint); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  @media (max-width: 560px) { .tools { justify-content: stretch; } .search { max-width: none; } .search .kbd { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="__HUB_MARK_CLASS__" id="mark">__HUB_MARK__</div>
    <div class="head">
      <h1 id="title">__HUB_TITLE__</h1>
      <div class="sub"><span class="sum" id="sum">loading…</span><span id="age"></span></div>
    </div>
    <div class="tools">
      <label class="search">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Filter services" aria-label="Filter services" autocomplete="off">
        <span class="kbd">/</span>
      </label>
      <button class="icon" id="theme" title="Theme: auto / light / dark" aria-label="Switch theme">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <div class="err" id="err"></div>
  <main class="grid" id="grid" aria-live="polite"></main>
  <footer><span>Keys: <span class="kbd">1</span>–<span class="kbd">9</span> open a service · <span class="kbd">/</span> filter · <span class="kbd">Enter</span> open the only match</span><span>Status refreshes every 10 s</span></footer>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const store = { get(k, d) { try { const v = localStorage.getItem("hub:" + k); return v === null ? d : v; } catch { return d; } }, set(k, v) { try { localStorage.setItem("hub:" + k, v); } catch {} } };
  let data = null, at = 0, visible = [];

  const themes = ["auto", "light", "dark"];
  const applyTheme = (t) => { if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t; $("theme").title = "Theme: " + t; };
  applyTheme(store.get("theme", "auto"));
  $("theme").addEventListener("click", () => { const t = themes[(themes.indexOf(store.get("theme", "auto")) + 1) % 3]; store.set("theme", t); applyTheme(t); });

  // A stable hue per service, so an icon-less card still gets a recognizable monogram.
  const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const icon = (s) => {
    const h = hue(s.slug);
    const bg = `background: hsl(${h} 80% 50% / .14); color: hsl(${h} 70% 45%)`;
    return `<div class="ico" style="${bg}">${esc(s.icon || s.name.trim().charAt(0).toUpperCase() || "?")}</div>`;
  };
  const ago = (ms) => { const s = Math.round((Date.now() - ms) / 1000); return s < 5 ? "just now" : s < 60 ? s + " s ago" : Math.round(s / 60) + " min ago"; };

  function render() {
    if (!data) return;
    const q = $("q").value.trim().toLowerCase();
    visible = data.services.filter((s) => !q || [s.name, s.slug, s.description].join(" ").toLowerCase().includes(q));
    const up = data.services.filter((s) => s.status === "up").length, total = data.services.length;
    const allUp = up === total;
    $("sum").innerHTML = `<span class="pill ${allUp ? "up" : up ? "unknown" : "down"}"><span class="dot"></span>${up} of ${total} up</span>`;
    document.title = (allUp ? "" : `(${total - up} down) `) + data.title;
    if (!data.icon) $("mark").textContent = data.title.trim().charAt(0).toUpperCase() || "·";
    if (!total) { $("grid").innerHTML = `<div class="empty">No services yet. Add a <code>[hub.services.&lt;name&gt;]</code> table to the registry and restart the hub.</div>`; return; }
    if (!visible.length) { $("grid").innerHTML = `<div class="empty">No service matches “${esc(q)}”.</div>`; return; }
    $("grid").innerHTML = visible.map((s, i) => {
      const proxy = s.kind === "proxy";
      const label = s.status === "up" ? "Up" : s.status === "down" ? "Down" : "No probe";
      const latency = s.latency_ms != null ? `${Math.round(s.latency_ms)} ms` : "";
      const detail = s.status === "down" ? s.detail || "" : latency;
      return `<a class="card ${esc(s.status)}" href="${esc(s.href)}" ${proxy ? "" : 'target="_blank" rel="noopener"'} data-i="${i}">
        <div class="top">${icon(s)}<div style="min-width:0"><div class="name">${esc(s.name)}${proxy ? "" : ' <span class="ext">↗</span>'}</div>
        <div class="route">${proxy ? "/" + esc(s.slug) + "/" : esc(s.href)}</div></div></div>
        <div class="desc">${esc(s.description) || "&nbsp;"}</div>
        <div class="foot"><span class="pill ${esc(s.status)}"><span class="dot"></span>${label}</span><span class="detail" title="${esc(s.detail || "")}">${esc(detail)}</span>${i < 9 ? `<span class="kbd">${i + 1}</span>` : ""}</div>
      </a>`;
    }).join("");
  }

  async function load() {
    try {
      const r = await fetch("api/services", { cache: "no-store", credentials: "same-origin" });
      if (r.status === 401) { location.reload(); return; }
      if (!r.ok) throw new Error("HTTP " + r.status);
      data = await r.json(); at = Date.now();
      $("err").style.display = "none";
      render();
    } catch (e) {
      $("err").textContent = "The hub is not answering (" + e.message + "). Showing the last good read.";
      $("err").style.display = "block";
    }
    tick();
  }
  const tick = () => { $("age").textContent = at ? "checked " + ago(at) : ""; };

  $("q").addEventListener("input", render);
  $("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && visible.length === 1) document.querySelector("a.card").click();
    if (e.key === "Escape") { $("q").value = ""; render(); $("q").blur(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); $("q").focus(); return; }
    if (/^[1-9]$/.test(e.key)) { const a = document.querySelector(`a.card[data-i="${+e.key - 1}"]`); if (a) a.click(); }
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  load();
  setInterval(() => { if (!document.hidden) load(); }, 10000);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
