<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plots</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f7f7f8;
    --line: #e4e4e7;
    --line-strong: #d4d4d8;
    --text: #18181b;
    --muted: #71717a;
    --faint: #a1a1aa;
    --accent: #2563eb;
    --accent-soft: #e8efff;
    --hover: #eeeef0;
    --new: #16a34a;
    --warn-bg: #fff7e6;
    --warn-line: #f5c26b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --sidebar: 340px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: var(--hover); }
  button:focus-visible, select:focus-visible, input:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .icon { width: 16px; height: 16px; display: inline-block; vertical-align: -3px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--bg); min-height: 50px; }
  header .brand { font-weight: 650; white-space: nowrap; }
  header .host { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #menu { padding: 5px 8px; }
  #menu[aria-pressed="true"] { background: var(--hover); }
  body.nav-hidden aside, body.nav-hidden .divider { display: none; }
  .picker { position: relative; flex: 1; min-width: 0; max-width: 560px; }
  .picker select { width: 100%; appearance: none; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 34px 7px 10px; cursor: pointer; text-overflow: ellipsis; }
  .picker::after { content: ""; position: absolute; right: 13px; top: 50%; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  header .spacer { flex: 1; }

  .layout { flex: 1; display: flex; min-height: 0; }
  aside { width: var(--sidebar); min-width: 220px; max-width: 70vw; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--panel); }
  .divider { width: 5px; margin-left: -3px; cursor: col-resize; z-index: 2; }
  .divider:hover, .divider.dragging { background: var(--accent-soft); }
  .tools { padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
  .search { position: relative; }
  .search .icon { position: absolute; left: 9px; top: 9px; color: var(--faint); }
  .search input { width: 100%; font: inherit; padding: 6px 28px 6px 30px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); color: var(--text); }
  #clear { position: absolute; right: 4px; top: 4px; border: 0; padding: 2px 6px; color: var(--muted); display: none; }
  .modes { display: flex; align-items: center; gap: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 4px 12px; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .count { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .actions { display: flex; gap: 4px; }
  .actions button { border: 0; padding: 4px 6px; color: var(--muted); font-size: 12px; }

  #list { flex: 1; overflow: auto; padding: 4px 0 16px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px calc(10px + var(--depth, 0) * 14px); cursor: pointer; user-select: none; white-space: nowrap; min-height: 28px; }
  .row:hover { background: var(--hover); }
  .row.selected { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .row .chev { width: 12px; flex: none; color: var(--muted); transition: transform .12s; }
  .row.open .chev { transform: rotate(90deg); }
  .row .name { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .row.dir .name { font-weight: 560; }
  /* A merged folder chain shows in full: first folder bold, the rest muted and wrapped. */
  .row.dir .name.chain { white-space: normal; overflow-wrap: anywhere; font-weight: 400; padding: 3px 0; }
  .row.dir .name.chain b { font-weight: 560; }
  .row.dir .name.chain .rest { color: var(--muted); font-size: 12px; }
  .row .file-ic { width: 12px; flex: none; color: var(--faint); }
  .row .meta { margin-left: auto; padding-left: 8px; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
  .row .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .row.flat { flex-wrap: wrap; row-gap: 0; padding-top: 5px; padding-bottom: 5px; }
  .row.flat .line { display: flex; width: 100%; align-items: center; gap: 6px; min-width: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--new); flex: none; }
  mark { background: #fde68a; color: inherit; border-radius: 2px; padding: 0 1px; }
  .empty { color: var(--muted); padding: 16px; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); min-height: 46px; }
  .crumbs { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: 13px; }
  .crumbs button { border: 0; padding: 2px 4px; color: var(--muted); }
  .crumbs .leaf { font-weight: 650; padding: 2px 4px; overflow-wrap: anywhere; }
  .crumbs .sep { color: var(--faint); }
  .bar .info { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .bar .btns { display: flex; gap: 6px; }
  .bar .btns button { padding: 5px 8px; }
  .updated { display: none; background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .stage { flex: 1; position: relative; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(255,255,255,.92); }
  .pcard { width: min(460px, 100%); border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 16px 18px; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
  .pcard .p-name { font-weight: 650; overflow-wrap: anywhere; }
  .pcard .p-path { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; margin: 2px 0 14px; }
  .p-track { height: 8px; border-radius: 999px; background: var(--hover); overflow: hidden; position: relative; }
  .p-fill { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .15s linear; }
  .p-track.indeterminate .p-fill { width: 30%; position: absolute; animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { from { left: -30%; } to { left: 100%; } }
  .p-numbers { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .p-numbers .r { color: var(--muted); text-align: right; }
  .p-steps { list-style: none; margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 13px; }
  .p-steps li { display: flex; align-items: center; gap: 8px; color: var(--faint); }
  .p-steps li .t { margin-left: auto; font-variant-numeric: tabular-nums; }
  .p-steps li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--line-strong); flex: none; }
  .p-steps li.active { color: var(--text); }
  .p-steps li.active::before { border-color: var(--accent); background: var(--accent-soft); animation: pulse 1s ease-in-out infinite; }
  .p-steps li.done { color: var(--muted); }
  .p-steps li.done::before { border-color: var(--new); background: var(--new); }
  .p-steps li.failed { color: #b45309; }
  .p-steps li.failed::before { border-color: #d97706; background: #fde68a; }
  @keyframes pulse { 50% { opacity: .4; } }
  .welcome { position: absolute; inset: 0; overflow: auto; padding: 28px; }
  .welcome h2 { margin: 0 0 4px; font-size: 18px; }
  .welcome p { margin: 0 0 18px; color: var(--muted); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .card { text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); display: flex; flex-direction: column; gap: 3px; }
  .card:hover { border-color: var(--accent); background: var(--bg); }
  .card .t { font-weight: 600; overflow-wrap: anywhere; }
  .card .s { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .keys { margin-top: 22px; color: var(--muted); font-size: 12px; }
  kbd { font: 11px var(--mono); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 7px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  #views { flex: none; }
  #views button { padding: 6px 12px; }
  body.view-runs #menu { display: none; }
  /* Focus: the plot alone fills the window; f or Esc brings the chrome back. */
  body.focus header, body.focus aside, body.focus .divider, body.focus .bar { display: none !important; }
  #unfocus { display: none; position: fixed; bottom: 12px; left: 12px; z-index: 20; background: var(--bg); box-shadow: 0 2px 10px rgba(0,0,0,.12); font-size: 12px; padding: 4px 10px; opacity: .35; transition: opacity .15s; }
  #unfocus:hover, #unfocus:focus-visible { opacity: 1; }
  body.focus #unfocus { display: inline-flex; align-items: center; gap: 6px; }

  /* Runs view: hash ↔ params over evaluations/<experiment>/RUN_ID_*.json. */
  .runs { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .rtools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .rtools .picker { flex: 1 1 200px; max-width: 340px; }
  .rtools .search { flex: 2 1 260px; min-width: 0; }
  .rtools .search.lookup { flex: 1 1 220px; }
  .rtools .search input { padding-right: 10px; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .rtools .count { margin-left: auto; }
  .rmeta { padding: 6px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  .rmeta b { color: var(--text); font-weight: 600; }
  .rmeta details { margin-top: 4px; }
  .rmeta summary { cursor: pointer; width: max-content; max-width: 100%; }
  .rmeta ul { margin: 4px 0 2px; padding-left: 18px; }
  .lookup-out { padding: 6px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; font-size: 13px; background: var(--bg); }
  .lookup-out .lk { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .lookup-out code { font: 12px var(--mono); overflow-wrap: anywhere; }
  .lookup-out button { padding: 1px 8px; font-size: 12px; }
  .muted { color: var(--muted); }
  .badge { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: 11px; line-height: 18px; background: var(--warn-bg); border: 1px solid var(--warn-line); white-space: nowrap; }
  .badge.cur { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .twrap { flex: 1; overflow: auto; min-height: 0; }
  .runs-t { border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 100%; }
  .runs-t th, .runs-t td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; background: var(--bg); }
  .runs-t thead th { position: sticky; top: 0; z-index: 1; height: 31px; }
  .runs-t thead tr.filters th { top: 31px; padding-top: 2px; padding-bottom: 6px; }
  .runs-t th.hash, .runs-t td.hash { position: sticky; left: 0; z-index: 1; box-shadow: inset -1px 0 0 var(--line); }
  .runs-t thead th.hash { z-index: 2; }
  .runs-t th .sort { border: 0; padding: 0; font-weight: 600; color: var(--muted); }
  .runs-t th.cfg .sort { font-weight: 400; font-style: italic; }
  .runs-t .cf { width: 100%; min-width: 64px; font: 12px var(--sans); padding: 3px 6px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg); color: var(--text); }
  .runs-t tbody tr:hover td { background: var(--hover); }
  .runs-t tbody tr.hit td { background: var(--accent-soft); }
  .runs-t td.num, .runs-t td.param, .runs-t td.cfg { font-variant-numeric: tabular-nums; }
  .runs-t td.empty { color: var(--muted); padding: 16px 12px; white-space: normal; }
  .hashbtn { font: 12px var(--mono); border: 0; padding: 0 2px; }
  .nil { color: var(--faint); }
  .ract { display: flex; gap: 4px; }
  .ract button, .ract a { font-size: 12px; padding: 1px 7px; border: 1px solid var(--line-strong); border-radius: 6px; color: inherit; text-decoration: none; }
  .ract a:hover { background: var(--hover); }
  .error { margin: 40px auto; max-width: 520px; padding: 16px; border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 10px; }

  @media (max-width: 760px) {
    body.nav-hidden aside { display: flex; }
    header .host, header .brand { display: none; }
    aside { position: fixed; top: 50px; bottom: 0; left: 0; width: min(88vw, 380px); max-width: none; z-index: 10; transform: translateX(-100%); transition: transform .18s; box-shadow: 2px 0 16px rgba(0,0,0,.12); }
    body.nav-open aside { transform: none; }
    .divider { display: none; }
    .bar .info { display: none; }
    #views button { padding: 6px 9px; }
    .rtools .picker, .rtools .search, .rtools .search.lookup { flex: 1 1 100%; max-width: none; }
    .runs-t th, .runs-t td { max-width: 180px; }
    .welcome { padding: 16px; }
    .row { min-height: 36px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v6H4V6h6"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></symbol>
  <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-focus" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
</svg>

<header>
  <button id="menu" aria-label="Show or hide the plot list" title="Show or hide the plot list  (b)"><svg class="icon"><use href="#i-menu"/></svg></button>
  <span class="brand">Projects</span>
  <div class="picker"><select id="project" aria-label="Project"></select></div>
  <div class="seg" id="views" role="group" aria-label="Plots or runs">
    <button id="view-plots" aria-pressed="true" title="Plots of this project">Plots</button>
    <button id="view-runs" aria-pressed="false" title="Runs: hash ↔ params of each experiment">Runs</button>
  </div>
  <span class="spacer"></span>
  <button id="refresh" title="Rescan projects and plots"><svg class="icon"><use href="#i-reload"/></svg></button>
  <span class="host" id="host"></span>
</header>

<div class="layout" id="plots-view">
  <aside id="aside">
    <div class="tools">
      <div class="search">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="filter" type="search" placeholder="Filter plots  ( / )" autocomplete="off" spellcheck="false" aria-label="Filter plots">
        <button id="clear" aria-label="Clear filter">×</button>
      </div>
      <div class="modes">
        <div class="seg" role="group" aria-label="View">
          <button id="mode-tree" aria-pressed="true">Folders</button>
          <button id="mode-recent" aria-pressed="false">Newest</button>
        </div>
        <span class="count" id="count"></span>
      </div>
      <div class="actions" id="tree-actions">
        <button id="expand">Expand all</button>
        <button id="collapse">Collapse all</button>
      </div>
    </div>
    <div id="list" role="tree" tabindex="-1"></div>
  </aside>
  <div class="divider" id="divider" aria-hidden="true"></div>
  <main>
    <div class="bar" id="bar" hidden>
      <div class="crumbs" id="crumbs"></div>
      <button class="updated" id="updated" title="The file was re-rendered">Updated · reload</button>
      <span class="info" id="info"></span>
      <div class="btns">
        <button id="focus" title="Focus: show the plot alone, filling the window  (f)"><svg class="icon"><use href="#i-focus"/></svg></button>
        <button id="reload" title="Reload plot"><svg class="icon"><use href="#i-reload"/></svg></button>
        <button id="copy" title="Copy link to this view"><svg class="icon"><use href="#i-link"/></svg></button>
        <button id="download" title="Download this plot's HTML file  (d)"><svg class="icon"><use href="#i-down"/></svg></button>
        <button id="open" title="Open plot alone in a new tab"><svg class="icon"><use href="#i-ext"/></svg></button>
      </div>
    </div>
    <div class="stage">
      <iframe id="frame" title="Plot" allow="fullscreen" hidden></iframe>
      <button id="unfocus" title="Leave focus  (f or Esc)">Leave focus <kbd>f</kbd></button>
      <div class="loading" id="loading" role="status" aria-live="polite">
        <div class="pcard">
          <div class="p-name" id="p-name"></div>
          <div class="p-path" id="p-path"></div>
          <div class="p-track" id="p-track"><div class="p-fill" id="p-fill"></div></div>
          <div class="p-numbers"><span id="p-left"></span><span class="r" id="p-right"></span></div>
          <ol class="p-steps">
            <li id="s-download">Download from the server<span class="t" id="s-download-t"></span></li>
            <li id="s-draw">Draw the plot in the browser<span class="t" id="s-draw-t"></span></li>
          </ol>
        </div>
      </div>
      <div class="welcome" id="welcome"></div>
    </div>
  </main>
</div>
<section class="runs" id="runs" hidden>
  <div class="rtools">
    <div class="picker"><select id="experiment" aria-label="Experiment"></select></div>
    <div class="search">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="rfilter" type="search" placeholder="Filter runs  ( / )  e.g. lr=1e-4 seed=0" autocomplete="off" spellcheck="false" aria-label="Filter runs: words or key=value, all must match">
    </div>
    <div class="search lookup">
      <svg class="icon"><use href="#i-link"/></svg>
      <input id="lookup" type="search" placeholder="Look up a hash or prefix" autocomplete="off" spellcheck="false" aria-label="Look up a hash or prefix, old hashes included">
    </div>
    <label class="check" title="Add a column for every key of the runs' resolved configs"><input type="checkbox" id="allcols"> all config params</label>
    <span class="count" id="rcount"></span>
  </div>
  <div class="lookup-out" id="lookup-out" hidden></div>
  <div class="rmeta" id="rmeta"></div>
  <div class="twrap"><table class="runs-t" id="rtable"><thead id="rhead"></thead><tbody id="rbody"></tbody></table></div>
</section>
<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const store = {
    get(key, fallback) { try { const v = localStorage.getItem("plots." + key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem("plots." + key, JSON.stringify(value)); } catch {} },
  };

  const state = {
    projects: [],
    project: null,      // id (absolute path)
    files: [],          // [{path, url, size, mtime}]
    file: null,         // relative path inside plots/
    mode: store.get("mode", "tree"),
    filter: "",
    open: new Set(),    // expanded folder paths for the current project
    seen: {},           // path -> mtime the page last knew
    visible: [],        // file paths in current display order, for keyboard navigation
    view: "plots",      // "plots" or "runs"
  };

  // ── formatting ──────────────────────────────────────────────────────────
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const size = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
  const ago = (t) => {
    if (!t) return "";
    const s = Date.now() / 1000 - t;
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    if (s < 86400 * 30) return Math.floor(s / 86400) + "d ago";
    return new Date(t * 1000).toISOString().slice(0, 10);
  };
  const stamp = (t) => new Date(t * 1000).toLocaleString([], { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  // Generic leaf names (index.html) say nothing; name them after their folder instead.
  const leafName = (p) => {
    const parts = p.split("/");
    const leaf = parts.pop().replace(/\.html?$/i, "");
    return /^index$/i.test(leaf) && parts.length ? parts.pop() : leaf;

  const tail = (p, n = 3) => { const parts = p.split("/"); parts.pop(); return (parts.length > n ? "…/" : "") + parts.slice(-n).join("/"); };

    if (!q) return esc(text);
    const i = text.toLowerCase().indexOf(q);
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
  };
  let toastTimer;
  const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600); };

  // ── data ────────────────────────────────────────────────────────────────
  async function getJSON(url) {
    const r = await fetch(url, { credentials: "same-origin", cache: "no-store" });
    if (r.status === 401) throw new Error("auth");
    if (!r.ok) throw new Error(r.status + " " + url);
    return r.json();
  }

  function errorHtml(err) {
    const msg = err.message === "auth"
      ? "This server needs its access token. Open this page once as <code>?token=&lt;token&gt;</code>; a cookie remembers it afterwards."
      : "Could not reach the plot server (" + esc(err.message) + ").";
    return '<div class="error">' + msg + "</div>";
  }
  function showError(err) {
    if (state.view === "runs") { $("rmeta").innerHTML = errorHtml(err); return; }
    $("welcome").innerHTML = errorHtml(err);
    $("welcome").hidden = false;
  }

  async function loadProjects() {
    const data = await getJSON("/api/projects");
    state.projects = data.projects;
    $("host").textContent = data.host;
    document.title = "Plots · " + data.host;
    const sel = $("project");
    const byRoot = new Map();
    for (const p of state.projects) {
      if (!byRoot.has(p.root)) byRoot.set(p.root, []);
      byRoot.get(p.root).push(p);
    }
    sel.innerHTML = "";
    for (const [root, list] of byRoot) {
      const group = document.createElement("optgroup");
      group.label = root;
      for (const p of list) {
        const o = document.createElement("option");
        o.value = p.id;
        o.textContent = p.name + "  ·  " + p.count + (p.count === 1 ? " plot" : " plots") + (p.latest ? "  ·  " + ago(p.latest) : "");
        group.appendChild(o);
      }
      sel.appendChild(group);
    }
  }

  async function loadFiles(keepSeen) {
    const data = await getJSON("/api/files?project=" + encodeURIComponent(state.project));
    const before = state.seen;
    state.files = data.files;
    const seenKey = "seen:" + state.project;
    const persisted = store.get(seenKey, null);
    if (!keepSeen) state.seen = persisted || Object.fromEntries(state.files.map((f) => [f.path, f.mtime]));
    else state.seen = before;
    if (!persisted) store.set(seenKey, state.seen);
  }

  const isNew = (f) => state.seen[f.path] === undefined || f.mtime > state.seen[f.path] + 1;
  function markSeen(f) {
    state.seen[f.path] = f.mtime;
    store.set("seen:" + state.project, state.seen);
  }

  // ── tree ────────────────────────────────────────────────────────────────
  function buildTree(files) {
    const root = { dirs: new Map(), files: [], count: 0, latest: 0, path: "" };
    for (const f of files) {
      const parts = f.path.split("/");
      let node = root;
      node.count++; node.latest = Math.max(node.latest, f.mtime);
      for (let i = 0; i < parts.length - 1; i++) {
        const key = parts.slice(0, i + 1).join("/");
        if (!node.dirs.has(parts[i])) node.dirs.set(parts[i], { name: parts[i], dirs: new Map(), files: [], count: 0, latest: 0, path: key });
        node = node.dirs.get(parts[i]);
        node.count++; node.latest = Math.max(node.latest, f.mtime);
      }
      node.files.push(f);
    }
    return root;
  }

  const matches = (f, q) => !q || f.path.toLowerCase().includes(q);

  function render(reveal = false) {
    const q = state.filter.trim().toLowerCase();
    const shown = state.files.filter((f) => matches(f, q));
    $("count").textContent = q ? shown.length + " of " + state.files.length : state.files.length + (state.files.length === 1 ? " plot" : " plots");
    $("tree-actions").style.display = state.mode === "tree" && !q ? "" : "none";
    const list = $("list");
    const out = [];
    state.visible = [];
    if (!state.files.length) {
      list.innerHTML = '<div class="empty">No HTML plots in this project yet.</div>';
      return;
    }
    if (!shown.length) {
      list.innerHTML = '<div class="empty">Nothing matches “' + esc(state.filter) + "”.</div>";
      return;
    }
    if (state.mode === "recent") {
      const sorted = shown.slice().sort((a, b) => b.mtime - a.mtime);
      for (const f of sorted) {
        state.visible.push(f.path);
        const dir = f.path.includes("/") ? f.path.slice(0, f.path.lastIndexOf("/")) : "";
        out.push(
          '<div class="row flat' + (f.path === state.file ? " selected" : "") + '" role="treeitem" tabindex="-1" data-file="' + esc(f.path) + '" title="' + esc(f.path) + '">' +
          '<div class="line">' + (isNew(f) ? '<span class="dot" title="New or re-rendered since you last opened it"></span>' : "") +
          '<span class="name">' + highlight(leafName(f.path), q) + '</span><span class="meta" title="' + esc(stamp(f.mtime)) + '">' + ago(f.mtime) + "</span></div>" +
          '<div class="line"><span class="sub" title="' + esc(dir) + '">' + (q ? highlight(dir, q) : esc(tail(f.path, 4))) + "</span></div></div>"
        );
      }
    } else {
      const tree = buildTree(shown);
      const walk = (node, depth) => {
        const dirs = [...node.dirs.values()].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
        for (let d of dirs) {
          let label = d.name;
          while (d.dirs.size === 1 && d.files.length === 0) {
            d = [...d.dirs.values()][0];
            label += "/" + d.name;
          }
          d = Object.assign({}, d, { name: label });
          const open = q ? true : state.open.has(d.path);
          out.push(
            '<div class="row dir' + (open ? " open" : "") + '" role="treeitem" aria-expanded="' + open + '" tabindex="-1" style="--depth:' + depth + '" data-dir="' + esc(d.path) + '">' +
            '<svg class="icon chev"><use href="#i-chev"/></svg>' + (d.name.includes("/")
              ? '<span class="name chain" title="' + esc(d.name) + '"><b>' + highlight(d.name.slice(0, d.name.indexOf("/")), q) + '</b><span class="rest">' + highlight(d.name.slice(d.name.indexOf("/")).replaceAll("/", "/\u200b"), q) + "</span></span>"
              : '<span class="name">' + highlight(d.name, q) + "</span>") +
            '<span class="meta" title="' + d.count + ' plots, newest ' + esc(stamp(d.latest)) + '">' + d.count + "</span></div>"
          );
          if (open) walk(d, depth + 1);
        }
        const files = node.files.slice().sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true }));
        for (const f of files) {
          state.visible.push(f.path);
          out.push(
            '<div class="row' + (f.path === state.file ? " selected" : "") + '" role="treeitem" tabindex="-1" style="--depth:' + depth + '" data-file="' + esc(f.path) + '" title="' + esc(f.path) + '">' +
            (isNew(f) ? '<span class="dot" title="New or re-rendered since you last opened it"></span>' : '<svg class="icon file-ic"><use href="#i-file"/></svg>') +
            '<span class="name">' + highlight(leafName(f.path), q) + '</span><span class="meta" title="' + esc(stamp(f.mtime)) + " · " + size(f.size) + '">' + ago(f.mtime) + "</span></div>"
          );
        }
      };
      walk(tree, 0);
    }
    list.innerHTML = out.join("");
    const sel = reveal && list.querySelector(".row.selected");
    if (sel) sel.scrollIntoView({ block: "nearest" });
  }

  function saveOpen() { store.set("open:" + state.project, [...state.open]); }

  function revealFile(path) {
    const parts = path.split("/");
    for (let i = 1; i < parts.length; i++) state.open.add(parts.slice(0, i).join("/"));
    saveOpen();
  }

  // ── viewer ──────────────────────────────────────────────────────────────
  function currentFile() { return state.files.find((f) => f.path === state.file) || null; }

  function renderBar() {
    const f = currentFile();
    $("bar").hidden = !f;
    if (!f) return;
    const parts = f.path.split("/");
    const crumbs = ['<button data-crumb="">plots</button>'];
    for (let i = 0; i < parts.length - 1; i++) {
      crumbs.push('<span class="sep">/</span><button data-crumb="' + esc(parts.slice(0, i + 1).join("/")) + '">' + esc(parts[i]) + "</button>");
    }
    crumbs.push('<span class="sep">/</span><span class="leaf">' + esc(parts[parts.length - 1]) + "</span>");
    $("crumbs").innerHTML = crumbs.join("");
    $("info").textContent = "rendered " + stamp(f.mtime) + " · " + size(f.size);
    $("info").title = ago(f.mtime);
  }

  let loadedMtime = null;
  function showFile(path, { push = true } = {}) {
    const f = state.files.find((x) => x.path === path);
    state.file = f ? f.path : null;
    if (push) writeHash();
    renderBar();
    $("updated").style.display = "none";
    const frame = $("frame");
    if (!f) {
      stopLoad();
      frame.hidden = true;
      frame.removeAttribute("src");
      renderWelcome();
      render();
      return;
    }
    $("welcome").hidden = true;
    frame.hidden = false;
    loadedMtime = f.mtime;
    loadPlot(f);
    markSeen(f);
    revealFile(f.path);
    render(true);
    document.body.classList.remove("nav-open");
  }
  // ── plot loading with progress ──────────────────────────────────────────
  // The page downloads the file itself to measure progress, then hands those exact bytes to the
  // frame as a same-origin blob, so the file crosses the wire once. A <base> pointing at the
  // plot's real URL keeps its relative links working; it is marked so the plot's own download
  // buttons can drop it. The untouched bytes are kept for the download button.
  // A plot rendered before plot-shell.js existed gets the server's copy injected right after the
  // <base>, ahead of Plotly, so every plot here has the same reader controls; the file is untouched.
  const load = { token: 0, controller: null, timer: null, showTimer: null, drawStart: 0, blobUrl: null, bytes: null };
  let shellSource = null;
  const getShell = () => shellSource || (shellSource = fetch("/plot-shell.js", { credentials: "same-origin", cache: "no-cache" })
    .then((r) => (r.ok ? r.text() : "")).catch(() => "").then((t) => { if (!t) shellSource = null; return t; }));
  function asFrameDocument(bytes, url, shell) {
    const text = new TextDecoder("utf-8").decode(bytes);
    const inject = shell && !text.includes("window.__plotShell") ? "<script data-plot-browser>" + shell.replace(/<\/script/gi, "<\\/script") + "<\/script>" : "";
    const base = '<base data-plot-browser href="' + esc(new URL(url, location.href).href) + '">' + inject;
    const head = text.search(/<head[^>]*>/i);
    const html = head >= 0 ? text.slice(0, head) + text.slice(head).replace(/<head[^>]*>/i, (m) => m + base) : base + text;
    if (load.blobUrl) URL.revokeObjectURL(load.blobUrl);
    load.blobUrl = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    return load.blobUrl;
  }
  const secs = (ms) => (ms / 1000).toFixed(1) + " s";
  const mb = (b) => (b / 1048576).toFixed(1);
  function setStep(id, cls, text) {
    const li = $(id);
    li.className = cls;
    if (text !== undefined) $(id + "-t").textContent = text;
  }
  function setBar(fraction) {
    const track = $("p-track");
    track.classList.toggle("indeterminate", fraction === null);
    $("p-fill").style.width = fraction === null ? "" : Math.min(100, fraction * 100).toFixed(1) + "%";
  }
  function stopLoad() {
    load.token++;
    if (load.controller) load.controller.abort();
    clearInterval(load.timer);
    clearTimeout(load.showTimer);
    $("loading").style.display = "none";
  }
  async function loadPlot(f) {
    stopLoad();
    load.bytes = null;
    const token = load.token;
    const url = f.url + "?v=" + Math.round(f.mtime);
    const frame = $("frame");
    $("p-name").textContent = leafName(f.path);
    $("p-path").textContent = f.path;
    setStep("s-download", "active", "");
    setStep("s-draw", "", "");
    setBar(0);
    $("p-left").textContent = "0.0 of " + mb(f.size) + " MB";
    $("p-right").textContent = "";
    // Small, fast plots never flash the panel.
    load.showTimer = setTimeout(() => { if (token === load.token) $("loading").style.display = "flex"; }, 200);
    const started = performance.now();
    load.controller = new AbortController();
    try {
      const response = await fetch(url, { credentials: "same-origin", signal: load.controller.signal });
      if (!response.ok) throw new Error(response.status === 401 ? "access token required" : "HTTP " + response.status);
      // The body arrives decompressed, so measure against the uncompressed size.
      const total = Number(response.headers.get("X-Plot-Size")) || f.size;
      const onWire = response.headers.get("Content-Encoding") === "gzip";
      const reader = response.body.getReader();
      const chunks = [];
      let received = 0, lastPaint = 0;
      const samples = [[started, 0]];
      for (;;) {
        const { done, value } = await reader.read();
        if (token !== load.token) return;
        if (done) break;
        chunks.push(value);
        received += value.length;
        const now = performance.now();
        if (now - lastPaint < 100) continue;
        lastPaint = now;
        samples.push([now, received]);
        while (samples.length > 2 && now - samples[0][0] > 2000) samples.shift();
        const [t0, b0] = samples[0];
        const rate = now > t0 ? (received - b0) / ((now - t0) / 1000) : 0;
        setBar(received / total);
        $("p-left").textContent = mb(received) + " of " + mb(total) + " MB · " + Math.floor((received / total) * 100) + "%";
        $("p-right").textContent = rate > 0 ? mb(rate) + " MB/s · ~" + Math.max(1, Math.ceil((total - received) / rate)) + " s left" : "";
        $("s-download-t").textContent = secs(now - started);
      }
      const took = performance.now() - started;
      setBar(1);
      $("p-left").textContent = mb(received) + " MB";
      $("p-right").textContent = (took > 0 ? mb(received / (took / 1000)) + " MB/s average" : "") + (onWire ? " · compressed in transit" : "");
      setStep("s-download", "done", secs(took));
      const bytes = new Uint8Array(received);
      let offset = 0;
      for (const c of chunks) { bytes.set(c, offset); offset += c.length; }
      load.bytes = bytes;
      const shell = await getShell();
      if (token !== load.token) return;
      var frameSrc = asFrameDocument(bytes, url, shell);
    } catch (err) {
      if (token !== load.token || err.name === "AbortError") return;
      setStep("s-download", "failed", err.message);
      var frameSrc = url;  // let the frame try on its own and show whatever the server says
    }
    // Drawing: the frame parses the page and runs its scripts; its load event marks the end.
    setStep("s-draw", "active", "0.0 s");
    setBar(null);
    load.drawStart = performance.now();
    load.timer = setInterval(() => { if (token === load.token) $("s-draw-t").textContent = secs(performance.now() - load.drawStart); }, 100);
    frame.dataset.token = token;
    frame.src = frameSrc;
  }
  $("frame").addEventListener("load", (e) => {
    const token = Number(e.currentTarget.dataset.token);  // read now: the event drops its target after dispatch
    if (token !== load.token) return;
    clearInterval(load.timer);
    clearTimeout(load.showTimer);
    setStep("s-draw", "done", secs(performance.now() - load.drawStart));
    setBar(1);
    setTimeout(() => { if (token === load.token) $("loading").style.display = "none"; }, 250);
  });

  function renderWelcome() {
    const w = $("welcome");
    w.hidden = false;
    const p = state.projects.find((x) => x.id === state.project);
    if (!p) { w.innerHTML = '<div class="empty">No project with a plots/ folder was found.</div>'; return; }
    const recent = state.files.slice().sort((a, b) => b.mtime - a.mtime).slice(0, 12);
    w.innerHTML =
      "<h2>" + esc(p.name) + "</h2><p>" + esc(p.id) + " · " + p.count + (p.count === 1 ? " plot" : " plots") + "</p>" +
      (recent.length ? '<div class="cards">' + recent.map((f) =>
        '<button class="card" data-file="' + esc(f.path) + '" title="' + esc(f.path) + '"><span class="t">' + esc(leafName(f.path)) + '</span><span class="s">' +
        esc(tail(f.path)) + '</span><span class="s">' + ago(f.mtime) + " · " + size(f.size) + "</span></button>").join("") + "</div>" : "") +
      '<div class="keys"><kbd>/</kbd> filter · <kbd>↑</kbd> <kbd>↓</kbd> previous / next plot · <kbd>Esc</kbd> clear filter · <kbd>r</kbd> reload plot · <kbd>d</kbd> download plot · <kbd>b</kbd> show / hide list · <kbd>f</kbd> focus on the plot · inside a plot <kbd>?</kbd> lists its zoom and view keys · <b>Runs</b> (header) looks up run hashes and their params</div>';
  }


  // ── runs view ───────────────────────────────────────────────────────────
  // Hash ↔ params for one experiment, from evaluations/<experiment>/RUN_ID_MAP.json and the tracked
  // config/<experiment>/RUN_ID_{VERSIONS,HISTORY}.json (or the copies the map embeds),
  // served raw by /api/runs. hashed-v2 maps carry params, version, wave, rig, state and full configs;
  // legacy maps get a limited view built from whatever run_id they recorded.
  const MAX_ROWS = 1000;
  const runs = {
    project: null,        // project the experiment list belongs to
    experiments: [],      // [{path, files: {MAP|VERSIONS|HISTORY: {size, mtime}}}]
    experiment: null,
    stamp: "",            // sizes and mtimes of the loaded files: reload only when they change
    map: null, versions: [], history: [],
    rows: [], byHash: new Map(),
    params: [],           // identity params of the current version, in order
    configKeys: [],       // flattened config keys that are not identity params
    cols: [],
    legacy: false,
    filter: "",           // free filter: words and key=value terms, all must match
    colFilters: {},       // column key -> text ("=x" exact)
    sort: { key: null, dir: 1 },
    hit: null,            // hash highlighted by a lookup
    allCols: store.get("runsAllCols", false),
  };

  const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
  const valText = (v) => v === undefined ? "" : v === null ? "null" : typeof v === "object" ? JSON.stringify(v) : String(v);
  const valHtml = (v) => v === undefined ? "" : v === null ? '<span class="nil">null</span>' : esc(valText(v));
  const shortHash = (h) => /^rid-[0-9a-f]{20,}$/i.test(h) ? h.slice(0, 12) + "…" : h;
  function flatten(obj, prefix = "", out = {}) {
    for (const [k, v] of Object.entries(obj || {})) {
      if (isObj(v) && Object.keys(v).length) flatten(v, prefix + k + ".", out);
      else out[prefix + k] = v;
    }
    return out;
  }
  // Legacy maps may only hold a rendered run_id; read its key=value segments back.
  function parseLabel(s) {
    const out = {};
    for (const part of String(s).split(/[,/]|__/)) { const i = part.indexOf("="); if (i > 0) out[part.slice(0, i)] = part.slice(i + 1); }
    return out;
  }
  function entryParams(e) {
    if (typeof e === "string") return parseLabel(e);
    if (!isObj(e)) return {};
    for (const k of ["params", "run_id"]) if (isObj(e[k])) return e[k];
    for (const k of ["run_id_flat", "run_id", "label", "path"]) if (typeof e[k] === "string") return parseLabel(e[k]);
    return {};
  }
  function findWandb(entry, flat) {
    for (const [k, v] of Object.entries(Object.assign({}, flat, entry))) {
      if (/wandb/i.test(k) && typeof v === "string" && /^https?:\/\//i.test(v)) return v;
    }
    return null;
  }
  const currentVersion = () => runs.versions.length ? runs.versions[runs.versions.length - 1] : null;

  function buildRuns() {
    const map = runs.map || {};
    const configs = isObj(map.configs) ? map.configs : {};
    let source = map.by_hash, fromPath = false;
    if (!isObj(source)) { source = isObj(map.by_path) ? map.by_path : isObj(map.by_run_id_flat) ? map.by_run_id_flat : {}; fromPath = true; }
    runs.legacy = !!runs.map && map.layout !== "hashed-v2";
    runs.rows = Object.entries(source).map(([key, e]) => {
      const entry = isObj(e) ? e : {};
      const config = isObj(configs[key]) ? configs[key] : null;
      const flat = config ? flatten(config) : {};
      const row = {
        // Unrecorded bookkeeping shows blank; a null identity param shows as null.
        hash: key, version: entry.version ?? map.version ?? undefined,
        params: Object.assign(fromPath ? parseLabel(key) : {}, entryParams(e)),
        wave: entry.wave_id ?? undefined, rig: entry.rig ?? undefined, state: entry.state ?? undefined,
        label: typeof entry.run_id_flat === "string" ? entry.run_id_flat : "",
        config, flat, wandb: findWandb(entry, flat),
      };
      row.text = [key, row.label, row.wave, row.rig, row.state, row.version != null ? "v" + row.version : "",
        ...Object.entries(row.params).map(([k, v]) => k + "=" + valText(v)),
        ...Object.entries(flat).map(([k, v]) => k + "=" + valText(v))].join(" ").toLowerCase();
      return row;
    });
    runs.byHash = new Map(runs.rows.map((r) => [r.hash, r]));
    const cur = currentVersion();
    const seen = new Set();
    runs.params = [];
    for (const p of [...(cur && Array.isArray(cur.params) ? cur.params.map(String) : []), ...runs.rows.flatMap((r) => Object.keys(r.params))]) {
      if (!seen.has(p)) { seen.add(p); runs.params.push(p); }
    }
    runs.configKeys = [...new Set(runs.rows.flatMap((r) => Object.keys(r.flat)))].filter((k) => !seen.has(k)).sort();
    buildCols();
  }

  function buildCols() {
    const col = (key, label, get, cls = "") => ({ key, label, get, cls });
    runs.cols = [
      col("hash", isObj(runs.map && runs.map.by_hash) || !runs.map ? "hash" : "run", (r) => r.hash, "hash"),
      col("version", "v", (r) => r.version, "num"),
      ...runs.params.map((p) => col("p:" + p, p, (r) => r.params[p], "param")),
      col("wave", "wave", (r) => r.wave),
      col("rig", "rig", (r) => r.rig),
      col("state", "state", (r) => r.state),
      ...(runs.allCols ? runs.configKeys.map((k) => col("c:" + k, k, (r) => r.flat[k], "cfg")) : []),
    ];
  }

  // ── filtering: "lr=1e-4" matches 0.0001; words match anywhere; everything given must match.
  function valueMatches(v, want, exact) {
    const s = valText(v).toLowerCase(), w = want.toLowerCase();
    if (s === w) return true;
    if (s !== "" && w !== "" && !isNaN(Number(s)) && !isNaN(Number(w))) return Number(s) === Number(w);
    return !exact && w !== "" && s.includes(w);
  }
  // What a key=value term can name: a column, an identity param, or a config key (also by its last dotted part).
  function rowValues(r, key) {
    const k = key.toLowerCase(), out = [];
    if (k === "hash" || k === "run") out.push(r.hash);
    if (k === "v" || k === "version") out.push(r.version);
    if (k === "wave" || k === "wave_id") out.push(r.wave);
    if (k === "rig") out.push(r.rig);
    if (k === "state") out.push(r.state);
    for (const [p, v] of Object.entries(r.params)) if (p.toLowerCase() === k) out.push(v);
    for (const [c, v] of Object.entries(r.flat)) { const lc = c.toLowerCase(); if (lc === k || lc.endsWith("." + k)) out.push(v); }
    return out;
  }
  const parseTerms = (text) => text.trim().split(/\s+/).filter(Boolean).map((t) => {
    const i = t.indexOf("=");
    return i > 0 ? { key: t.slice(0, i), value: t.slice(i + 1) } : { text: t.toLowerCase() };
  });
  function rowMatches(r, terms) {
    for (const t of terms) {
      if (t.text !== undefined ? !r.text.includes(t.text) : !rowValues(r, t.key).some((v) => valueMatches(v, t.value, false))) return false;
    }
    for (const c of runs.cols) {
      const f = (runs.colFilters[c.key] || "").trim();
      if (f && !valueMatches(c.get(r), f.startsWith("=") ? f.slice(1) : f, f.startsWith("="))) return false;
    }
    return true;
  }
  function compare(a, b) {
    if (a === b) return 0;
    if (a === undefined || a === null) return 1;
    if (b === undefined || b === null) return -1;
    const sa = valText(a), sb = valText(b);
    if (typeof a !== "object" && typeof b !== "object" && sa !== "" && sb !== "" && !isNaN(Number(sa)) && !isNaN(Number(sb))) return Number(sa) - Number(sb);
    return sa.localeCompare(sb, undefined, { numeric: true });
  }

  // ── rendering
  function renderRunsMeta() {
    const m = runs.map;
    if (!runs.experiments.length) {
      $("rmeta").innerHTML = "No experiment under <b>evaluations/</b> holds a RUN_ID_MAP.json yet; the map is written when a wave finishes.";
      return;
    }
    const cur = currentVersion();
    const parts = [];
    if (m) parts.push("layout <b>" + esc(m.layout || "unknown") + "</b>");
    else parts.push("no RUN_ID_MAP.json yet");
    if (cur) parts.push("identity v" + esc(cur.version) + ": <b>" + esc((cur.params || []).join(", ") || "none") + "</b>" + (cur.date ? " since " + esc(cur.date) : ""));
    else if (m && m.version != null) parts.push("version " + esc(m.version));
    if (runs.history.length) parts.push(runs.history.length + (runs.history.length === 1 ? " migration" : " migrations"));
    let out = parts.join(" · ");
    if (runs.legacy) out += ' <span class="badge" title="Legacy layouts record no versions, waves, rigs or configs in their map">legacy layout: limited view</span>';
    if (runs.versions.length || runs.history.length) {
      const versions = runs.versions.map((v) => "<li>v" + esc(v.version) + ": " + esc((v.params || []).join(", ")) +
        (v.date ? " · " + esc(v.date) : "") + (v.reason ? " · " + esc(v.reason) : "") + "</li>").join("");
      const history = runs.history.map((h) => {
        const backfill = isObj(h.backfill) ? Object.entries(h.backfill).map(([k, b]) => esc(k) + "=" + esc(valText(isObj(b) && "value" in b ? b.value : b)) +
          (isObj(b) && b.source ? " (" + esc(b.source) + ")" : "")).join(", ") : "";
        return "<li>v" + esc(h.from_version) + " → v" + esc(h.to_version) + (h.date ? " · " + esc(h.date) : "") + " · " +
          Object.keys(isObj(h.map) ? h.map : {}).length + " hashes renamed" + (backfill ? " · backfill " + backfill : "") + "</li>";
      }).join("");
      out += "<details><summary>versions and migrations</summary>" + (versions ? "<ul>" + versions + "</ul>" : "") + (history ? "<ul>" + history + "</ul>" : "") + "</details>";
    }
    $("rmeta").innerHTML = out;
  }

  function renderRunsHead() {
    const th = (c, inner) => '<th class="' + c.cls + '">' + inner + "</th>";
    const labels = runs.cols.map((c) => th(c, '<button class="sort" data-sort="' + esc(c.key) + '" title="Sort by ' + esc(c.label) + '">' + esc(c.label) +
      (runs.sort.key === c.key ? (runs.sort.dir > 0 ? " ▲" : " ▼") : "") + "</button>")).join("");
    const filters = runs.cols.map((c) => th(c, '<input class="cf" type="search" data-col="' + esc(c.key) + '" value="' + esc(runs.colFilters[c.key] || "") +
      '" placeholder="' + (c.key === "hash" ? "prefix" : "filter") + '" title="Substring or number; =x for an exact match" aria-label="Filter ' + esc(c.label) + '" autocomplete="off" spellcheck="false">')).join("");
    $("rhead").innerHTML = runs.rows.length ? "<tr>" + labels + "<th></th></tr><tr class=\"filters\">" + filters + "<th></th></tr>" : "";
  }

  function renderRunsBody() {
    const terms = parseTerms(runs.filter);
    const shown = runs.rows.filter((r) => rowMatches(r, terms));
    const byParams = (a, b) => { for (const p of runs.params) { const d = compare(a.params[p], b.params[p]); if (d) return d; } return compare(a.hash, b.hash); };
    const col = runs.cols.find((c) => c.key === runs.sort.key);
    shown.sort(col ? (a, b) => runs.sort.dir * compare(col.get(a), col.get(b)) || byParams(a, b) : byParams);
    const total = runs.rows.length;
    $("rcount").textContent = !runs.map ? "" : (shown.length === total ? "" : shown.length + " of ") + total + (total === 1 ? " run" : " runs");
    const span = runs.cols.length + 1;
    if (!total) { $("rbody").innerHTML = runs.map ? '<tr><td class="empty">This map lists no runs.</td></tr>' : ""; return; }
    const out = shown.slice(0, MAX_ROWS).map((r) =>
      '<tr data-hash="' + esc(r.hash) + '"' + (r.hash === runs.hit ? ' class="hit"' : "") + ">" +
      runs.cols.map((c) => c.key === "hash"
        ? '<td class="hash"><button class="hashbtn" data-act="copy-hash" title="' + esc(r.hash + (r.label ? "\n" + r.label : "") + "\nClick to copy") + '">' + esc(shortHash(r.hash)) + "</button></td>"
        : '<td class="' + c.cls + '" title="' + esc(c.label + " = " + valText(c.get(r))) + '">' + valHtml(c.get(r)) + "</td>").join("") +
      '<td><div class="ract"><button data-act="copy-hash" title="Copy the full hash">hash</button>' +
      (r.config ? '<button data-act="copy-config" title="Copy this run’s full resolved config as JSON">config</button>' : "") +
      '<button data-act="plots" title="Show the plots of this experiment, which select runs by hash">plots</button>' +
      (r.wandb ? '<a href="' + esc(r.wandb) + '" target="_blank" rel="noopener noreferrer" title="' + esc(r.wandb) + '">WandB</a>' : "") +
      "</div></td></tr>");
    if (!shown.length) out.push('<tr><td colspan="' + span + '" class="empty">No run matches. Filters take words or key=value terms (lr=1e-4 seed=0); all must match.</td></tr>');
    if (shown.length > MAX_ROWS) out.push('<tr><td colspan="' + span + '" class="empty">Showing ' + MAX_ROWS + " of " + shown.length + "; narrow the filter to see the rest.</td></tr>");
    $("rbody").innerHTML = out.join("");
  }

  // ── lookup: a hash or prefix, current or from before a run_id migration (followed through HISTORY)
  function migrations() {
    const next = new Map();
    for (const h of runs.history) {
      for (const [from, to] of Object.entries(isObj(h.map) ? h.map : {})) next.set(from, { to, from: h.from_version, toV: h.to_version });
    }
    return next;
  }
  function follow(next, hash) {
    const hops = [], seen = new Set([hash]);
    let h = hash;
    while (next.has(h)) { const step = next.get(h); hops.push(step); h = step.to; if (seen.has(h)) break; seen.add(h); }
    return { final: h, hops };
  }
  function lookup(q) {
    q = q.trim().toLowerCase();
    if (q.length < 3) return null;
    const hit = (h) => { const l = h.toLowerCase(); return l.startsWith(q) || l.startsWith("rid-" + q); };
    const next = migrations(), out = [];
    for (const r of runs.rows) if (hit(r.hash)) out.push({ hash: r.hash, final: r.hash, hops: [] });
    for (const old of next.keys()) if (hit(old) && !runs.byHash.has(old)) out.push(Object.assign({ hash: old }, follow(next, old)));
    return out;
  }
  function renderLookup() {
    const q = $("lookup").value, el = $("lookup-out"), found = lookup(q);
    el.hidden = found === null;
    if (found === null) { el.innerHTML = ""; return; }
    if (!found.length) { el.innerHTML = '<div class="lk muted">No run hash, current or migrated, starts with “' + esc(q.trim()) + "”.</div>"; return; }
    el.innerHTML = found.slice(0, 20).map((x) => {
      const cur = runs.byHash.get(x.final);
      const first = x.hops[0], last = x.hops[x.hops.length - 1];
      const badge = x.hops.length
        ? '<span class="badge" title="An old hash, renamed by a run_id migration">migrated v' + esc(first.from ?? "?") + " → v" + esc(last.toV ?? "?") + "</span>"
        : '<span class="badge cur">current</span>';
      const label = cur ? runs.params.map((p) => p + "=" + valText(cur.params[p])).join(" ") : "not in the current map";
      return '<div class="lk">' + badge + " <code>" + esc(x.hash) + "</code>" + (x.hops.length ? " → <code>" + esc(x.final) + "</code>" : "") +
        ' <span class="muted">' + esc(label) + "</span>" + (cur ? '<button data-show="' + esc(x.final) + '">show</button>' : "") + "</div>";
    }).join("") + (found.length > 20 ? '<div class="lk muted">' + (found.length - 20) + " more; type more of the hash.</div>" : "");
  }

  function renderRuns() {
    renderRunsMeta();
    renderRunsHead();
    renderRunsBody();
    renderLookup();
  }

  // ── loading
  async function getRunFile(kind) {
    const url = "/api/runs?" + new URLSearchParams({ project: state.project, experiment: runs.experiment, file: kind });
    const r = await fetch(url, { credentials: "same-origin", cache: "no-cache" });  // revalidates by ETag
    if (r.status === 401) throw new Error("auth");
    if (r.status === 404) return undefined;  // VERSIONS/HISTORY fall back to the map's embedded copies
    if (!r.ok) throw new Error(r.status + " RUN_ID_" + kind + ".json");
    return r.json();
  }
  const expStamp = (x) => x ? x.path + "|" + Object.entries(x.files).map(([k, f]) => k + ":" + f.mtime + ":" + f.size).join(",") : "";
  async function loadExperiments() {
    const data = await getJSON("/api/experiments?project=" + encodeURIComponent(state.project));
    runs.project = data.project;
    runs.experiments = data.experiments;
    const sel = $("experiment");
    sel.innerHTML = runs.experiments.length
      ? runs.experiments.map((x) => '<option value="' + esc(x.path) + '">' + esc(x.path) + (x.files.MAP ? "  ·  " + esc(ago(x.files.MAP.mtime)) : "  ·  no map yet") + "</option>").join("")
      : "<option>no experiments</option>";
    sel.disabled = !runs.experiments.length;
    sel.value = runs.experiment || "";
  }
  // Returns whether anything changed.
  async function loadExperiment(path, { force = false } = {}) {
    const x = runs.experiments.find((e) => e.path === path) || null;
    if (!force && runs.experiment === (x && x.path) && runs.stamp === expStamp(x)) return false;
    runs.experiment = x ? x.path : null;
    runs.stamp = expStamp(x);
    $("experiment").value = runs.experiment || "";
    if (!x) { runs.map = null; runs.versions = []; runs.history = []; buildRuns(); return true; }
    store.set("experiment:" + state.project, x.path);
    // MAP comes from evaluations/<exp>/, VERSIONS and HISTORY from the tracked config/<exp>/. When
    // either of those is missing (404), the copies the map embeds (versions, history) stand in.
    const get = (kind) => x.files[kind]
      ? getRunFile(kind).catch((err) => { if (err.message === "auth") throw err; toast("Could not read RUN_ID_" + kind + ".json"); return undefined; })
      : Promise.resolve(undefined);
    const [map, versions, history] = await Promise.all([get("MAP"), get("VERSIONS"), get("HISTORY")]);
    if (runs.experiment !== x.path) return false;  // another experiment was picked meanwhile
    runs.map = isObj(map) ? map : null;
    const embedded = (key) => (runs.map && Array.isArray(runs.map[key]) ? runs.map[key] : []);
    runs.versions = Array.isArray(versions) ? versions : embedded("versions");
    runs.history = Array.isArray(history) ? history : embedded("history");
    buildRuns();
    return true;
  }

  // Shows the Runs view for the current project; experiment and q come from the URL when routing.
  async function openRuns(experiment, q, { push = false } = {}) {
    try {
      if (!state.project) { renderRuns(); return; }
      if (runs.project !== state.project) {
        runs.experiment = null;
        runs.stamp = "";
        await loadExperiments();
      }
      const has = (p) => p && runs.experiments.some((x) => x.path === p);
      const saved = store.get("experiment:" + state.project, null);
      let e = has(experiment) ? experiment : has(runs.experiment) ? runs.experiment : has(saved) ? saved : null;
      if (!e && runs.experiments.length) e = runs.experiments.slice().sort((a, b) => ((b.files.MAP || {}).mtime || 0) - ((a.files.MAP || {}).mtime || 0))[0].path;
      // Filters belong to one experiment's columns and hashes; a new experiment starts unfiltered.
      if (e !== runs.experiment) { runs.colFilters = {}; runs.sort = { key: null, dir: 1 }; runs.hit = null; if (typeof q !== "string") q = ""; }
      if (typeof q === "string") { runs.filter = q; $("rfilter").value = q; }
      await loadExperiment(e);
      renderRuns();
      writeHash({ replace: !push });
    } catch (err) { showError(err); }
  }

  async function refreshRuns() {
    if (state.view !== "runs" || !state.project) return;
    if (runs.project !== state.project) { await openRuns(null); return; }
    await loadExperiments();
    if (await loadExperiment(runs.experiment)) renderRuns();
  }

  function setRunsFilter(text) {
    runs.filter = text;
    $("rfilter").value = text;
    renderRunsBody();
    writeHash({ replace: true });
  }

  async function copyText(text, done) {
    try { await navigator.clipboard.writeText(text); toast(done); return; } catch {}
    // Plain-HTTP pages have no async clipboard; fall back to a selection copy, then to a prompt.
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed"; area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    area.remove();
    if (ok) toast(done); else prompt("Copy:", text);
  }

  // Plots keep run selection inside the file, keyed by hash, never in the path; the plots that can
  // show a run are the ones of its experiment, under plots/<experiment>/.
  function showRunPlots(r) {
    setView("plots", { push: true });
    setPlotFilter(runs.experiment + "/");
    setSidebar(true);
    toast("Plots of " + runs.experiment + "; pick " + shortHash(r.hash) + " inside a plot");
  }

  function setView(view, { push = false } = {}) {
    state.view = view === "runs" ? "runs" : "plots";
    const isRuns = state.view === "runs";
    document.body.classList.toggle("view-runs", isRuns);
    $("plots-view").hidden = isRuns;
    $("runs").hidden = !isRuns;
    $("view-plots").setAttribute("aria-pressed", String(!isRuns));
    $("view-runs").setAttribute("aria-pressed", String(isRuns));
    if (push) writeHash();
  }

  $("view-plots").addEventListener("click", () => { if (state.view !== "plots") setView("plots", { push: true }); });
  $("view-runs").addEventListener("click", () => { if (state.view !== "runs") { setView("runs"); openRuns(null, undefined, { push: true }); } });
  $("experiment").addEventListener("change", (e) => openRuns(e.target.value, undefined, { push: true }));
  $("rfilter").addEventListener("input", (e) => setRunsFilter(e.target.value));
  $("lookup").addEventListener("input", renderLookup);
  $("lookup-out").addEventListener("click", (e) => {
    const b = e.target.closest("[data-show]");
    if (!b) return;
    runs.hit = b.dataset.show;
    setRunsFilter(b.dataset.show);
  });
  $("allcols").checked = runs.allCols;
  $("allcols").addEventListener("change", (e) => {
    runs.allCols = e.target.checked;
    store.set("runsAllCols", runs.allCols);
    buildCols();
    renderRunsHead();
    renderRunsBody();
  });
  $("rtable").addEventListener("input", (e) => {
    const key = e.target.dataset.col;
    if (key === undefined) return;
    runs.colFilters[key] = e.target.value;
    renderRunsBody();
  });
  $("rtable").addEventListener("click", (e) => {
    const s = e.target.closest("[data-sort]");
    if (s) {
      const key = s.dataset.sort;
      runs.sort = runs.sort.key !== key ? { key, dir: 1 } : runs.sort.dir > 0 ? { key, dir: -1 } : { key: null, dir: 1 };
      renderRunsHead();
      renderRunsBody();
      return;
    }
    const b = e.target.closest("[data-act]");
    const r = b && runs.byHash.get(b.closest("tr").dataset.hash);
    if (!r) return;
    if (b.dataset.act === "copy-hash") copyText(r.hash, "Hash copied");
    else if (b.dataset.act === "copy-config") copyText(JSON.stringify(r.config, null, 2), "Config copied");
    else if (b.dataset.act === "plots") showRunPlots(r);
  });

  // ── routing ─────────────────────────────────────────────────────────────
  // Plots: #p=<project>&f=<plot>. Runs: #v=runs&p=<project>&e=<experiment>&q=<filter>.
  function readHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    return { view: h.get("v") === "runs" ? "runs" : "plots", project: h.get("p"), file: h.get("f"), experiment: h.get("e"), q: h.get("q") || "" };
  }
  function writeHash({ replace = false } = {}) {
    const h = new URLSearchParams();
    if (state.view === "runs") h.set("v", "runs");
    if (state.project) h.set("p", state.project);
    if (state.view === "runs") {
      if (runs.experiment) h.set("e", runs.experiment);
      if (runs.filter.trim()) h.set("q", runs.filter.trim());
    } else if (state.file) h.set("f", state.file);
    const next = "#" + h.toString();
    if (location.hash !== next) history[replace ? "replaceState" : "pushState"](null, "", next);
  }

  async function selectProject(id, file, { push = true } = {}) {
    state.project = id;
    $("project").value = id;
    store.set("project", id);
    state.open = new Set(store.get("open:" + id, []));
    state.file = null;
    await loadFiles(false);
    if (file && state.files.some((f) => f.path === file)) showFile(file, { push });
    else { if (push) writeHash(); showFile(null, { push: false }); }
  }

  async function route({ push = false } = {}) {
    const h = readHash();
    const exists = (id) => state.projects.some((p) => p.id === id);
    let id = exists(h.project) ? h.project : null;
    if (!id) id = exists(store.get("project", null)) ? store.get("project", null) : null;
    if (!id && state.projects.length) id = state.projects.slice().sort((a, b) => (b.latest || 0) - (a.latest || 0))[0].id;
    setView(h.view);
    if (!id) { renderWelcome(); render(); if (h.view === "runs") renderRuns(); return; }
    if (id !== state.project) await selectProject(id, h.view === "plots" ? h.file : null, { push: push && h.view === "plots" });
    else if (h.view === "plots" && h.file !== state.file) showFile(h.file, { push: false });
    if (h.view === "runs") await openRuns(h.experiment, h.q, { push });
  }

  // ── refresh ─────────────────────────────────────────────────────────────
  async function refresh({ projects = false } = {}) {
    try {
      if (projects) { await loadProjects(); $("project").value = state.project; }
      if (!state.project) return;
      await loadFiles(true);
      const f = currentFile();
      if (state.file && !f) { toast("That plot no longer exists"); showFile(null); return; }
      if (f && loadedMtime !== null && f.mtime > loadedMtime + 1) $("updated").style.display = "inline-block";
      renderBar();
      render();
      await refreshRuns();
    } catch (err) { showError(err); }
  }

  // ── events ──────────────────────────────────────────────────────────────
  $("project").addEventListener("change", async (e) => {
    if (state.view !== "runs") { selectProject(e.target.value, null); return; }
    await selectProject(e.target.value, null, { push: false });
    await openRuns(null, undefined, { push: true });
  });
  $("list").addEventListener("click", (e) => {
    const row = e.target.closest(".row");
    if (!row) return;
    if (row.dataset.dir !== undefined) {
      const d = row.dataset.dir;
      if (state.filter) return;
      state.open.has(d) ? state.open.delete(d) : state.open.add(d);
      saveOpen();
      render();
    } else if (row.dataset.file) showFile(row.dataset.file);
  });
  $("welcome").addEventListener("click", (e) => { const c = e.target.closest("[data-file]"); if (c) showFile(c.dataset.file); });
  $("crumbs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-crumb]");
    if (!b) return;
    const path = b.dataset.crumb;
    setMode("tree");
    setPlotFilter("");
    if (path) {
      state.open = new Set([...state.open].filter((p) => !(p === path || p.startsWith(path + "/"))));
      const parts = path.split("/");
      for (let i = 1; i <= parts.length; i++) state.open.add(parts.slice(0, i).join("/"));
    } else state.open.clear();
    saveOpen();
    render();
    setSidebar(true);
    const row = [...$("list").querySelectorAll(".row.dir")].find((r) => r.dataset.dir === path);
    if (row) row.scrollIntoView({ block: "center" });
  });
  function setPlotFilter(text) {
    state.filter = text;
    $("filter").value = text;
    $("clear").style.display = text ? "block" : "none";
    render();
  }
  $("filter").addEventListener("input", (e) => setPlotFilter(e.target.value));
  $("clear").addEventListener("click", () => { setPlotFilter(""); $("filter").focus(); });
  function setMode(mode) {
    state.mode = mode; store.set("mode", mode);
    $("mode-tree").setAttribute("aria-pressed", mode === "tree");
    $("mode-recent").setAttribute("aria-pressed", mode === "recent");
    render();
  }
  $("mode-tree").addEventListener("click", () => setMode("tree"));
  $("mode-recent").addEventListener("click", () => setMode("recent"));
  $("expand").addEventListener("click", () => {
    for (const f of state.files) { const parts = f.path.split("/"); for (let i = 1; i < parts.length; i++) state.open.add(parts.slice(0, i).join("/")); }
    saveOpen(); render();
  });
  $("collapse").addEventListener("click", () => { state.open.clear(); saveOpen(); render(); });
  const reloadPlot = () => { const f = currentFile(); if (f) showFile(f.path, { push: false }); };
  $("reload").addEventListener("click", reloadPlot);
  $("updated").addEventListener("click", reloadPlot);
  $("open").addEventListener("click", () => { const f = currentFile(); if (f) window.open(f.url, "_blank", "noopener"); });
  // Saves the file exactly as rendered, under its leaf name, ready to send to someone.
  function downloadPlot() {
    const f = currentFile();
    if (!f) return;
    const a = document.createElement("a");
    a.download = f.path.split("/").pop();
    a.href = load.bytes ? URL.createObjectURL(new Blob([load.bytes], { type: "text/html" })) : f.url;
    document.body.appendChild(a);
    a.click();
    a.remove();
    if (a.href.startsWith("blob:")) setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }
  $("download").addEventListener("click", downloadPlot);
  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(location.href); toast("Link copied"); }
    catch { prompt("Copy this link:", location.href); }
  });
  $("refresh").addEventListener("click", async () => { await refresh({ projects: true }); toast("Rescanned"); });
  const narrow = () => window.matchMedia("(max-width: 760px)").matches;
  function setSidebar(show) {
    if (narrow()) document.body.classList.toggle("nav-open", show);
    else { document.body.classList.toggle("nav-hidden", !show); store.set("sidebarHidden", !show); }
    $("menu").setAttribute("aria-pressed", String(show));
  }
  const sidebarShown = () => narrow() ? document.body.classList.contains("nav-open") : !document.body.classList.contains("nav-hidden");
  $("menu").addEventListener("click", () => setSidebar(!sidebarShown()));
  if (store.get("sidebarHidden", false)) document.body.classList.add("nav-hidden");
  $("menu").setAttribute("aria-pressed", String(sidebarShown()));
  window.addEventListener("popstate", () => route());
  window.addEventListener("focus", () => refresh());
  setInterval(() => { if (!document.hidden) refresh(); }, 30000);

  function setFocus(on) {
    document.body.classList.toggle("focus", on);
    $("focus").setAttribute("aria-pressed", String(on));
  }
  $("focus").addEventListener("click", () => setFocus(true));
  $("unfocus").addEventListener("click", () => setFocus(false));
  // Keys pressed inside the plot frame that belong to this page arrive from plot-shell.js.
  window.addEventListener("message", (e) => {
    if (e.source !== $("frame").contentWindow || !e.data || e.data.type !== "plot-shell-key") return;
    plotKey(String(e.data.key));
  });

  function step(delta) {
    if (!state.visible.length) return;
    const i = state.visible.indexOf(state.file);
    const next = i < 0 ? (delta > 0 ? 0 : state.visible.length - 1) : Math.min(state.visible.length - 1, Math.max(0, i + delta));
    if (state.visible[next] !== state.file) showFile(state.visible[next]);
  }
  document.addEventListener("keydown", (e) => {
    const runsView = state.view === "runs";
    const active = runsView ? $("rfilter") : $("filter");
    const inField = e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA";
    if (e.key === "/" && !inField) { e.preventDefault(); active.focus(); active.select(); return; }
    if (e.key === "Escape" && e.target === active) { runsView ? setRunsFilter("") : setPlotFilter(""); active.blur(); return; }
    if (e.key === "Escape" && e.target === $("lookup")) { $("lookup").value = ""; renderLookup(); $("lookup").blur(); return; }
    if (runsView) return;  // the keys below act on plots
    const typing = e.target === $("filter");
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === "SELECT") return;
    if (e.key === "Enter" && typing && state.visible.length) { showFile(state.visible[0]); return; }
    if (typing && !e.key.startsWith("Arrow")) return;
    if (plotKey(e.key)) e.preventDefault();
  });
  // Plot keys, from this page or forwarded by a plot's shell; true when handled.
  function plotKey(key) {
    if (state.view === "runs") return false;
    const focused = document.body.classList.contains("focus");
    if (key === "ArrowDown" || key === "j") step(1);
    else if (key === "ArrowUp" || key === "k") step(-1);
    else if (key === "r") reloadPlot();
    else if (key === "d") downloadPlot();
    else if (key === "b") { setFocus(false); setSidebar(!sidebarShown()); }
    else if (key === "f") { if (currentFile() || focused) setFocus(!focused); }
    else if (key === "Escape" && focused) setFocus(false);
    else if (key === "/") { setFocus(false); $("filter").focus(); $("filter").select(); }
    else return false;
    return true;
  }

  // Resizable sidebar.
  const divider = $("divider");
  const width = store.get("sidebar", null);
  if (width) document.documentElement.style.setProperty("--sidebar", width + "px");
  divider.addEventListener("pointerdown", (e) => {
    divider.classList.add("dragging");
    divider.setPointerCapture(e.pointerId);
    $("frame").style.pointerEvents = "none";
    const move = (ev) => document.documentElement.style.setProperty("--sidebar", Math.max(220, Math.min(ev.clientX, window.innerWidth * 0.7)) + "px");
    const up = (ev) => {
      divider.classList.remove("dragging");
      $("frame").style.pointerEvents = "";
      store.set("sidebar", Math.round($("aside").getBoundingClientRect().width));
      divider.removeEventListener("pointermove", move);
      divider.removeEventListener("pointerup", up);
    };
    divider.addEventListener("pointermove", move);
    divider.addEventListener("pointerup", up);
  });

  // ── start ───────────────────────────────────────────────────────────────
  setMode(state.mode);
  (async () => {
    try {
      if (new URLSearchParams(location.search).has("token")) history.replaceState(null, "", location.pathname + location.hash);
      await loadProjects();
      await route({ push: false });
      if (!location.hash && state.project) history.replaceState(null, "", "#" + new URLSearchParams({ p: state.project }).toString());
    } catch (err) { showError(err); }
  })();
})();
</script>
</body>
</html>
