interface:
  display_name: "Sweep Supervisor"
  short_description: "Hub-side wave supervision, follow-ups, notices, status and ETA"
  default_prompt: "Use $sweep-supervisor to show a running wave's status, ETA and warnings (or its per-GPU table), follow it from this chat with watch, relay an answer to the unattended supervisor, rebalance or steal runs across GPUs, add a lane, queue a fix or analysis follow-up, recover after a rig fault, or run one unattended supervisor tick for a wave launched by $sweep-dispatch."
